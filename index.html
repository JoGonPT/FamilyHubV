<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Vertical Hub (TV Box)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="vertical-progress-bar"></div>

    <div class="app-container">
        <!-- Sidebar Navigation (Controlada pela Seta Cima/Esquerda do Comando) -->
        <aside class="sidebar minimalist-sidebar">
            <nav class="sidebar-nav">
                <button class="nav-btn focusable active" data-target="view-calendar"><span class="icon">📅</span> <span class="lbl">Calendário</span></button>
                <button class="nav-btn focusable" data-target="view-tasks"><span class="icon">✅</span> <span class="lbl">Tarefas</span></button>
                <button class="nav-btn focusable" data-target="view-meals"><span class="icon">🍽️</span> <span class="lbl">Refeições</span></button>
                <button class="nav-btn focusable" data-target="view-lists"><span class="icon">📋</span> <span class="lbl">Listas de Compras</span></button>
            </nav>
        </aside>

        <!-- Main Workspace Vertical -->
        <main class="main-content">
            <header class="top-header">
                <h1 class="clock-display" id="clock-digital">00:00</h1>
                <h2 class="date-display" id="date-display">Carregando...</h2>
            </header>

            <section id="view-calendar" class="spa-view active">
                <div class="grid-container">
                    <div class="grid-body" id="calendar-grid">
                        <!-- JS Renderiza 5 Dias Uteis + Fim de Semana no Fundo -->
                    </div>
                </div>
            </section>

            <section id="view-tasks" class="spa-view">
                <h2 class="view-title">Tarefas Pendentes</h2>
                <ul id="tasks-list" class="clean-list"></ul>
            </section>

            <section id="view-meals" class="spa-view">
                <h2 class="view-title">Refeições Menu</h2>
                <ul id="meals-list" class="clean-list"></ul>
            </section>

            <section id="view-lists" class="spa-view">
                <h2 class="view-title">Carrinho de Compras</h2>
                <ul id="shopping-list" class="clean-list"></ul>
            </section>

            <footer class="bottom-footer">
                <div id="mini-weather" class="weather-mini">
                    <span id="weather-icon">☁️</span> <span id="temperature">Carregando...</span>
                </div>
                <div class="receitas-lembrar">
                    <span style="font-size:0.8rem; text-transform:uppercase; color:var(--text-sec); letter-spacing:1px; margin-bottom:5px; display:block;">Restaurante Casa:</span>
                    <span id="next-meal-footer" style="font-weight: 500; font-size:1.1rem; color: #fff;">Próxima Refeição: Por Agendar</span>
                </div>
            </footer>
        </main>
    <!-- Modal de Confirmação (Sim/Não) para Comando Mi Box -->
    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="confirm-msg">Tem a certeza que deseja apagar?</h2>
            <div class="modal-actions">
                <button id="confirm-yes" class="modal-btn focusable card-paula" style="border-width:2px;">Sim, Apagar</button>
                <button id="confirm-no" class="modal-btn focusable" style="border-width:2px;">Não, Manter</button>
            </div>
        </div>
    </div>
    </div>

    <!-- Scripts e Lógica Remota -->
    <script type="module" src="js/db.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
